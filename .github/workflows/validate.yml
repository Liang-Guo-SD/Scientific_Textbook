name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public package
        run: python3 skills/scientific-textbook/scripts/validate_package.py
      - name: Test baseline harness validator
        run: python3 -m unittest discover -s tests -v
